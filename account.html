<script>
const MB=1048576;let ME=null,PUB='',HK='',up=null;
const api=async(action,{method='GET',body,query=''}={})=>{
 const r=await fetch('api.php?action='+action+query,{method,headers:{'Content-Type':'application/json','X-Luna':'1'},body:body?JSON.stringify(body):undefined});
 if(r.status===401&&action!=='login'){show(false);throw Object.assign(new Error('login'),{code:'login'})}
 const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(errText(j)),{code:j.error});return j};
const show=m=>{$('#main').hidden=!m;$('#login').hidden=m;$('#out').hidden=!m;if(!m){$('#who').textContent='';$('#adm').hidden=true}};
const msg2=(id,s)=>{$(id).textContent=s||'';$(id).hidden=!s};
const base=f=>pageUrl(f,PUB);
const urlOf=e=>base('download.php')+'?g='+e.gid+(e.key?'#'+e.key:'');
function pubWarn(){const h=location.hostname,w=$('#pubwarn');const local=['localhost','127.0.0.1','::1','[::1]'].includes(h);w.hidden=!(local&&!PUB);w.textContent=L('a.localhost_warn',{host:h})}
async function login(){try{await api('login',{method:'POST',body:{username:$('#u').value,password:$('#p').value,code:$('#lc').value}});msg2('#lerr');$('#codebox').hidden=true;$('#lc').value='';start()}
 catch(e){if(e.code==='code_required')$('#codebox').hidden=false;msg2('#lerr',e.message)}}
async function logout(){await api('logout',{method:'POST'});up=null;ME=null;$('#uploader').innerHTML='';show(false)}
function go(t){if(!document.querySelector('[data-sec="'+t+'"]'))t='home';document.querySelectorAll('[data-sec]').forEach(e=>e.hidden=e.dataset.sec!==t);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(location.hash!=='#'+t)history.replaceState(null,'','#'+t);window.scrollTo(0,0)}
function tab(n){go(n===2?'links':'send')}
const left=()=>ME.quotaBytes===null?Infinity:Math.max(0,ME.quotaBytes-ME.usedBytes);
function renderQuota0(){if(!ME)return;const q=ME.quotaBytes,u=ME.usedBytes,m=$('#qm'),x=[];
 if(ME.maxFileBytes)x.push(L('c.max_file',{size:fmtSize(ME.maxFileBytes)}));if(ME.monthlyReset)x.push(L('c.monthly'));if(ME.expiresAt)x.push(L('c.expires',{date:DT(ME.expiresAt)}));$('#qx').textContent=x.join(' · ');
 if(q===null){$('#qa').textContent=fmtSize(u);$('#qb').textContent=L('c.unlimited');m.hidden=true;msg2('#qw');return}
 const pct=q?u/q*100:100;$('#qa').textContent=L('c.used_of',{used:fmtSize(u),total:fmtSize(q)});$('#qb').textContent=L('c.left',{left:fmtSize(left())});
 m.hidden=false;m.className='meter'+(pct>=100?' full':pct>=85?' warn':'');m.firstChild.style.width=Math.min(100,pct)+'%';
 const w=$('#qw');w.hidden=pct<85;w.textContent=pct>=100?L('c.full'):L('c.low')}
async function createLink(){try{await api('my_links_create',{method:'POST',body:{label:$('#label').value,maxMB:$('#mb').value,expiryHours:$('#hrs').value,retentionDays:$('#days').value,maxDownloads:$('#dl2').value,oneTime:$('#one').checked}});msg2('#cerr');$('#label').value='';refresh()}catch(e){msg2('#cerr',e.message)}}
async function delLink(t){if(confirm(L('a.confirm_link'))){await api('my_links_delete',{method:'POST',body:{token:t}});refresh()}}
async function delFile(id){if(confirm(L('a.confirm_file'))){await api('my_file_delete',{method:'POST',body:{id}});refresh()}}
async function refresh(){
 const [me,links,fl]=await Promise.all([api('me'),api('my_links_list'),api('my_files_list')]);ME=me;PUB=me.publicUrl||'';pubWarn();renderQuota();if(up)up.renderRows();renderSecurity();loadActivity();
 const hist={};loadHist(HK).forEach(e=>hist[e.gid]=e);
 const lb=$('#links');lb.innerHTML='';
 links.forEach(l=>{const exp=l.expiresAt<Date.now(),used=l.oneTime&&l.used>=1,url=base('upload.php')+'?t='+l.token;
  const st=exp?['a.st_expired','chip bad']:used?['a.st_used','chip bad']:['a.st_active','chip ok'];
  const d=el('div','link'),h=el('div','link-h');h.append(el('b','',l.label||L('a.nolabel')),el('span',st[1],L(st[0])));d.append(h);
  const m=el('div','meta');m.append(el('span','',L('a.m_max',{size:fmtSize(l.maxBytes)})),el('span','',exp?L('a.m_expired'):L('a.m_until',{date:DT(l.expiresAt)})),el('span','',l.oneTime?L('a.m_single'):L('a.m_multi')),el('span','',L('a.m_uploads',{n:l.used})),el('span','',L('a.m_keep',{n:l.retentionDays})),el('span','',l.maxDownloads>0?L('a.m_dl',{n:l.maxDownloads}):L('a.m_nodl')));d.append(m);
  const row=el('div','url');row.append(el('code','',url));
  if(!exp&&!used){const b=el('button','btn sm',L('copy'));b.onclick=ev=>copyText(url,ev.target);row.append(b)}
  const x=el('button','btn danger sm',L('delete'));x.onclick=()=>delLink(l.token);row.append(x);d.append(row);if(!exp&&!used)d.append(linkTools(url));lb.append(d)});
 if(!links.length)lb.append(el('p','empty',L('a.no_links')));
 renderTransfers(fl,hist);renderStats(links,fl)}
let showAll=false,LASTFL=[],LASTHIST={};
const IC='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>';
function renderQuota(){renderQuota0();const q=ME.quotaBytes,lf=left();$('#ub').textContent=q===null?L('c.unlimited'):fmtSize(lf);$('#uof').textContent=q===null?'':L('x.usable_of',{total:fmtSize(q)});
 const mx=Math.min(ME.maxMBCap*MB,lf,ME.maxFileBytes||Infinity);$('#umax').textContent=lf>0?L('x.can_send',{size:fmtSize(mx)}):L('x.none_left');
 if(q!==null){const pct=q?ME.usedBytes/q*100:100;$('#qm').className='meter'+(pct>=100?' full':pct>=85?' warn':'')}}
function toggleAll(){showAll=!showAll;renderTransfers(LASTFL,LASTHIST)}
function renderTransfers(fl,hist){LASTFL=fl;LASTHIST=hist;const box=$('#tlist');box.innerHTML='';const G=new Map();fl.forEach(f=>{if(!G.has(f.group))G.set(f.group,[]);G.get(f.group).push(f)});const gs=[...G.values()],more=$('#tmore');
 if(!gs.length){box.append(el('p','empty',L('a.no_files')));more.hidden=true;return}
 (showAll?gs:gs.slice(0,6)).forEach(fs=>{const f=fs[0],size=fs.reduce((n,x)=>n+x.size,0),dl=Math.max(...fs.map(x=>x.downloads)),h=hist[f.group],cl=h?urlOf(h):(f.pw?base('download.php')+'?g='+f.group:null),until=Math.min(...fs.map(x=>x.deleteAt));
  const c=el('div','tcard'),ic=el('div','tic'),b=el('div','tbody'),a=el('div','tact');ic.innerHTML=IC;
  b.append(el('b','',f.linkToken?L('a.th_link')+': '+(f.linkLabel||L('a.nolabel')):L('c.direct')),el('div','tmeta',[fs.length===1?L('x.nfiles1'):L('x.nfilesn',{n:fs.length}),fmtSize(size),L('a.th_up')+' '+DT(f.uploadedAt)].join(' · ')));
  const ch=el('div','tchips');ch.append(el('span','chip',L('a.th_dl')+': '+dl+(f.maxDownloads>0?' / '+f.maxDownloads:'')),el('span',until-Date.now()<172800000?'chip bad':'chip',L('a.th_del')+' '+DT(until)));if(f.pw)ch.append(el('span','chip',L('a.haspw')));b.append(ch);
  if(cl){const k=el('button','btn ghost sm',L('copy'));k.onclick=()=>{navigator.clipboard.writeText(cl);k.textContent=L('copied')};a.append(k)}
  const x=el('button','btn danger sm',L('delete'));x.onclick=async()=>{if(confirm(L('x.confirm_tr'))){await Promise.all(fs.map(y=>api('my_file_delete',{method:'POST',body:{id:y.id}})));refresh()}};a.append(x);
  c.append(ic,b,a);box.append(c)});
 more.hidden=gs.length<=6;more.textContent=showAll?L('x.show_less'):L('x.show_all',{n:gs.length})}
function renderStats(links,fl){const gs=new Map();fl.forEach(f=>gs.set(f.group,Math.max(gs.get(f.group)||0,f.downloads)));const act=links.filter(l=>l.expiresAt>Date.now()&&!(l.oneTime&&l.used>=1)).length;
 const box=$('#stats');box.innerHTML='';[[gs.size,'x.st_tr'],[act,'x.st_links'],[[...gs.values()].reduce((n,x)=>n+x,0),'x.st_dl']].forEach(([n,k])=>{const d=el('div','stat');d.append(el('b','',String(n)),el('span','',L(k)));box.append(d)})}
// ---- security ----
function renderSecurity(){$('#toff0').hidden=ME.totp||!$('#tsetup').hidden;$('#ton').hidden=!ME.totp;$('#tgbox').hidden=!ME.telegramAvailable;if(document.activeElement!==$('#tgchat'))$('#tgchat').value=ME.telegram||''}
async function changePw(){msg2('#pwerr');msg2('#pwok');try{await api('change_password',{method:'POST',body:{current:$('#pcur').value,new:$('#pnew').value}});$('#pcur').value='';$('#pnew').value='';msg2('#pwok',L('c.pw_changed'))}catch(e){msg2('#pwerr',e.message)}}
async function totpStart(){try{const j=await api('totp_setup',{method:'POST',body:{}});$('#tqr').innerHTML=qrSvg(j.uri);$('#tsec').textContent=j.secret;$('#tsetup').hidden=false;$('#toff0').hidden=true;msg2('#terr')}catch(e){msg2('#terr',e.message)}}
async function totpOn(){try{await api('totp_enable',{method:'POST',body:{code:$('#tcode').value}});$('#tsetup').hidden=true;$('#tcode').value='';msg2('#terr');refresh()}catch(e){msg2('#terr',e.message)}}
async function totpOff(){try{await api('totp_disable',{method:'POST',body:{password:$('#tpw').value,code:$('#tcode2').value}});$('#tpw').value='';$('#tcode2').value='';msg2('#terr');refresh()}catch(e){msg2('#terr',e.message)}}
async function saveTg(){try{await api('set_telegram',{method:'POST',body:{chat:$('#tgchat').value}});msg2('#tgok',L('c.saved'));setTimeout(()=>msg2('#tgok'),2000)}catch(e){msg2('#tgok',e.message)}}
async function loadActivity(){const a=await api('my_activity'),tb=$('#acts');tb.innerHTML='';
 a.forEach(r=>{const tr=document.createElement('tr');tr.append(el('td','',DT(r.ts)),el('td','',L('act.'+r.action)),el('td','',r.detail));tb.append(tr)});
 if(!a.length){const tr=document.createElement('tr'),td=el('td','empty',L('c.no_activity'));td.colSpan=3;tr.append(td);tb.append(tr)}}
async function start(){try{const me=await api('me');ME=me;PUB=me.publicUrl||'';HK='my:'+me.uid;show(true);$('#who').textContent=me.username;$('#adm').hidden=me.role!=='admin';$('#mb').max=me.maxMBCap;
 if(!up)up=mountUploader($('#uploader'),{token:null,limit:()=>Math.min(ME.maxMBCap*MB,left()),maxFiles:()=>ME.maxFiles,maxFileBytes:()=>ME.maxFileBytes,histKey:HK,linkOf:urlOf,onUploaded:refresh,
  extraHtml:'<div class="two" style="margin-top:1rem"><label class="field"><span data-i="c.keep"></span><input type="number" id="sdays" value="7" min="1"></label><label class="field"><span data-i="a.dllimit"></span><input type="number" id="sdl" value="0" min="0"></label></div>',
  extra:()=>({retentionDays:Math.max(1,parseInt($('#sdays').value)||7),maxDownloads:Math.max(0,parseInt($('#sdl').value)||0)})});
 refresh().catch(e=>{show(false);msg2('#lerr',e.message)})}catch(e){show(false);if(e.code!=='login')msg2('#lerr',e.message)}}
document.addEventListener('langchange',()=>{if(ME&&!$('#main').hidden){refresh();if(up){up.renderRows();up.renderDone()}pubWarn()}});
go((location.hash||'#home').slice(1));start();
</script><script>
(function(){const q=s=>document.querySelector(s);
async function team(me){const box=q('[data-t=team]'),ok=!me.isSub&&me.subLimit>0;box.hidden=!ok;if(!ok){if(location.hash==='#team')go('home');return}
 const j=await api('sub_list'),used=j.subs.reduce((n,s)=>n+s.usedBytes,0);q('#teamsub').textContent=L('x.t_sub',{n:j.subs.length,max:j.limit});
 const sm=q('#teamsum');sm.innerHTML='';[[fmtSize(me.ownUsed),'x.t_you'],[fmtSize(used),'x.t_total'],[j.subs.length+' / '+j.limit,'x.t_slots']].forEach(([v,k])=>{const d=el('div','stat');d.append(el('b','',v),el('span','',L(k)));sm.append(d)});
 const lb=q('#teamlist');lb.innerHTML='';
 j.subs.forEach(s=>{const c=el('div','tcard'),ic=el('div','tic','👤'),b=el('div','tbody'),a=el('div','tact'),pct=me.quotaBytes?Math.round(s.usedBytes/me.quotaBytes*100):0;
  b.append(el('b','',s.username),el('div','tmeta',[L('x.t_used',{size:fmtSize(s.usedBytes)}),L('x.t_share',{p:pct}),L('x.t_up',{n:s.uploads}),s.lastAt?L('x.t_last',{date:DT(s.lastAt)}):L('x.t_never')].join(' · ')));
  const bar=el('div','sbar'),i=el('i');i.style.width=Math.min(100,pct)+'%';bar.append(i);b.append(bar);const ch=el('div','tchips');ch.append(el('span',s.active?'chip ok':'chip bad',s.active?L('a.st_active'):L('x.t_off')));b.append(ch);
  const pw=el('button','btn ghost sm',L('x.t_pw'));pw.onclick=async()=>{const p=prompt(L('x.t_newpw'));if(p){try{await api('sub_update',{method:'POST',body:{id:s.id,password:p}});alert(L('c.saved'))}catch(e){alert(e.message)}}};
  const tg=el('button','btn ghost sm',s.active?L('x.t_disable'):L('x.t_enable'));tg.onclick=async()=>{await api('sub_update',{method:'POST',body:{id:s.id,active:!s.active}});fill()};
  const x=el('button','btn danger sm',L('delete'));x.onclick=async()=>{if(confirm(L('x.t_confirm'))){await api('sub_delete',{method:'POST',body:{id:s.id}});fill()}};
  a.append(pw,tg,x);c.append(ic,b,a);lb.append(c)});
 q('#teamform').hidden=q('#tadd').hidden=j.subs.length>=j.limit}

 const up=document.querySelector('.top .right a[href="upgrade.php"]');if(up)up.hidden=me.isSub||me.role==='admin';if(me.role==='admin')return;

 else if(me.freeTier){q('#plant').textContent='Free plan: '+p.freeMB+' MB';q('#plans').textContent=me.freeResetsLeft>0?'Your space refreshes on '+nx+'. Free refreshes left: '+me.freeResetsLeft+'.':'No free refreshes left. When your space runs out, upgrade to keep sending.';box.hidden=false}
 await team(me)}catch(e){}}
